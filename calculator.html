<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .buttons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px;
            font-size: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            min-height: 20px;
            color: #333;
        }
        .error {
            color: #d9534f;
            background-color: #fde8e8;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="inputs-container">
        <input type="text" id="num1" placeholder="Первое число">
        <input type="text" id="num2" placeholder="Второе число">
    </div>
    
    <div class="buttons-container">
        <button id="btn-sum">сумма</button>
        <button id="btn-sub">разность</button>
        <button id="btn-mul">произведение</button>
        <button id="btn-div">деление</button>
    </div>
    
    <div class="result-box" id="result">Результат</div>
</div>

<script>
    // Математические функции
    const add = (a, b) => a + b;
    const subtract = (a, b) => a - b;
    const multiply = (a, b) => a * b;
    const divide = (a, b) => {
        if (b === 0) return "Ошибка: деление на ноль";
        return a / b;
    };

    // Получаем элементы из DOM
    const input1 = document.getElementById('num1');
    const input2 = document.getElementById('num2');
    const resultBox = document.getElementById('result');

    const btnSum = document.getElementById('btn-sum');
    const btnSub = document.getElementById('btn-sub');
    const btnMul = document.getElementById('btn-mul');
    const btnDiv = document.getElementById('btn-div');

    // Функция для получения чисел и валидизации
    function calculate(operation) {
        const val1 = input1.value.trim();
        const val2 = input2.value.trim();

        if (val1 === '' || val2 === '' || isNaN(val1) || isNaN(val2)) {
            resultBox.textContent = "Ошибка: введите числа!";
            resultBox.classList.add('error');
            return;
        }

        resultBox.classList.remove('error');
        const num1 = Number(val1);
        const num2 = Number(val2);

        const res = operation(num1, num2);
        resultBox.textContent = res;
    }

    // Обработчики событий
    btnSum.addEventListener('click', () => calculate(add));
    btnSub.addEventListener('click', () => calculate(subtract));
    btnMul.addEventListener('click', () => calculate(multiply));
    btnDiv.addEventListener('click', () => calculate(divide));
</script>

</body>
</html>
